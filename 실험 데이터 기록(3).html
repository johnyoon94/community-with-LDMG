<style>

    --ink-soft: #000000;
    --ink-faint: #000000;

  .lb-tabs { display: flex; gap: 8px; max-width: 680px; margin: 0 auto 18px; }

  .lb-title-input {
    display: block; width: 100%; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700;

  .lb-hint { font-size: 11.5px; color: var(--ink-faint); margin: -6px 0 16px; }

  .lb-ycol-label {
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase;

  .lb-ycol-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .lb-ycol-chip {

  .lb-ycol-chip.active { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }

  .lb-compare-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .lb-compare-table th, .lb-compare-table td {

  .lb-preview-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 3px; }

  .lb-preview-table th, .lb-preview-table td {

  @media (max-width: 420px) {
    .lb-form-grid { grid-template-columns: 1fr; }

    .lb-title { font-size: 24px; }

</style>

<body>
<div class="lb-header" id="lb-header">
      <div class="lb-eyebrow">⚗ LOGBOOK <button class="lb-btn-icon" onclick="startEditTitle()" title="제목 수정" style="vertical-align:middle;">✎</button></div>
      <h1 class="lb-title">실험 데이터 기록</h1>
      <p class="lb-subtitle">측정값과 시료를 실험별로 기록하고 추적하세요. (이 브라우저에 저장됩니다)</p></div>
<div class="lb-tabs">
  <button class="lb-tab active" id="lb-tab-experiments" onclick="switchSection(&#39;experiments&#39;)">실험 기록</button>
  <button class="lb-tab" id="lb-tab-analysis" onclick="switchSection(&#39;analysis&#39;)">데이터 분석</button>
</div>
<div class="lb-container" id="app"><button class="lb-back-btn" onclick="goBackToList()">← 목록으로</button>
    <div class="lb-card">
      <div style="display:flex; align-items:center; gap:4px;">
             <h2 class="lb-exp-name" style="margin:0;">PDMS mesh electrode</h2>
             <button class="lb-btn-icon" onclick="startEditExpName()" title="이름 수정">✎</button>
           </div>
      <div class="lb-exp-meta">시작일 07. 27. 오전 09:22 · 기본 단위 ℃</div>
      <p class="lb-exp-desc">Cr/Ag mesh electrode</p>
      <button class="lb-btn-icon" onclick="askDeleteExperiment()" title="실험 삭제">🗑</button>
    </div>

    <form class="lb-card" onsubmit="handleAddEntry(event)">
      <p class="lb-section-label">측정값 기록</p>
      <div class="lb-form-grid">
        <div class="lb-form-row">
          <label>시료 ID (선택)</label>
          <input name="sampleId" placeholder="S-001">
        </div>
        <div class="lb-form-row">
          <label>측정값 *</label>
          <input name="value" type="number" step="any" placeholder="0.00" required="">
        </div>
      </div>
      <div class="lb-form-grid">
        <div class="lb-form-row">
          <label>단위</label>
          <input name="unit" placeholder="℃">
        </div>
        <div class="lb-form-row">
          <label>메모 (선택)</label>
          <input name="notes" placeholder="특이사항">
        </div>
      </div>
      <button type="submit" class="lb-btn lb-btn-primary">+ 기록 추가</button>
    </form>
  <div class="lb-card"><p class="lb-section-label">측정 기록 (0)</p><div class="lb-empty">아직 기록된 측정값이 없습니다. 위에서 첫 기록을 추가하세요.</div></div><p class="lb-footer-note">모든 기록은 이 브라우저(localStorage)에 자동 저장됩니다.</p></div>
<input type="file" id="lb-file-input" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleFileUpload(event)">

<script>
// ---------- storage ----------
const EXP_KEY = 'lb_experiments_v1';
function entriesKey(id) { return 'lb_entries_v1_' + id; }
const DATASET_KEY = 'lb_datasets_v1';
function datasetRowsKey(id) { return 'lb_dataset_rows_v1_' + id; }
const TITLE_KEY = 'lb_title_v1';
function loadTitleConfig() {
  try {
    const raw = localStorage.getItem(TITLE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveTitleConfig(cfg) {
  try { localStorage.setItem(TITLE_KEY, JSON.stringify(cfg)); } catch (e) {}
}

function loadExperiments() {
  try {
    const raw = localStorage.getItem(EXP_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveExperiments(list) {
  try { localStorage.setItem(EXP_KEY, JSON.stringify(list)); }
  catch (e) { state.error = '실험 목록 저장에 실패했습니다. (브라우저 저장 공간을 확인해주세요)'; }
}
function loadEntries(id) {
  try {
    const raw = localStorage.getItem(entriesKey(id));
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveEntries(id, list) {
  try { localStorage.setItem(entriesKey(id), JSON.stringify(list)); }
  catch (e) { state.error = '측정 기록 저장에 실패했습니다.'; }
}
function loadDatasets() {
  try {
    const raw = localStorage.getItem(DATASET_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveDatasets(list) {
  try { localStorage.setItem(DATASET_KEY, JSON.stringify(list)); }
  catch (e) { state.error = '데이터셋 목록 저장에 실패했습니다. (브라우저 저장 공간을 확인해주세요)'; }
}
function loadDatasetRows(id) {
  try {
    const raw = localStorage.getItem(datasetRowsKey(id));
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveDatasetRows(id, rows) {
  try { localStorage.setItem(datasetRowsKey(id), JSON.stringify(rows)); }
  catch (e) { state.error = '업로드한 데이터 저장에 실패했습니다. (파일이 너무 크거나 저장 공간이 부족할 수 있어요)'; }
}

// ---------- helpers ----------
function genId() {
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function formatTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}
function round(n, p) {
  p = p === undefined ? 4 : p;
  if (n === null || n === undefined || isNaN(n)) return '—';
  const f = Math.pow(10, p);
  return (Math.round(n * f) / f).toString();
}

// ---------- state ----------
let state = {
  section: 'experiments', // 'experiments' | 'analysis'

  title: '실험 데이터 기록',
  subtitle: '측정값과 시료를 실험별로 기록하고 추적하세요. (이 브라우저에 저장됩니다)',
  editingTitle: false,

  experiments: [],
  selectedId: null,
  entries: [],
  view: 'list', // 'list' | 'detail'

function getDatasetSheets(ds) {

  if (ds.sheets) return ds.sheets;
  return [{ name: '데이터', headers: ds.headers || [], numericCols: ds.numericCols || [], rowCount: ds.rowCount || 0, colCount: ds.colCount || 0 }];
}
function normalizeRowsBySheet(raw) {
  if (Array.isArray(raw)) return { '데이터': raw }; // backward-compat
  return raw || {};
}

// ---------- sheet-to-sheet overlay comparison (within one multi-sheet dataset) ----------
function computeCommonHeaders(ds, sheetNames) {
  if (!ds || !sheetNames.length) return [];
  const sheets = getDatasetSheets(ds).filter(s => sheetNames.includes(s.name));
  if (!sheets.length) return [];
  return sheets.reduce((common, s) => common.filter(h => s.headers.includes(h)), [...sheets[0].headers]);
}
function computeCommonNumericCols(ds, sheetNames) {
  if (!ds || !sheetNames.length) return [];
  const sheets = getDatasetSheets(ds).filter(s => sheetNames.includes(s.name));
  if (!sheets.length) return [];
  return sheets.reduce((common, s) => common.filter(h => s.numericCols.includes(h)), [...sheets[0].numericCols]);
}

// ---------- dataset upload & analysis ----------
function isNumericColumn(rows, key) {
  let sawNumber = false;
  for (const r of rows) {
    const v = r[key];
    if (v === null || v === undefined || v === '') continue;
    const n = typeof v === 'number' ? v : Number(v);
    if (isNaN(n)) return false;
    sawNumber = true;
  }
  return sawNumber;
}

function addDataset(name, sheetsData) {
  // sheetsData: [{ name: 'Sheet1', headers: [...], rows: [...] }, ...]
  const sheets = sheetsData.map(s => {
    const cleanHeaders = s.headers.filter(h => h !== undefined && h !== null && String(h).trim() !== '');
    const numericCols = cleanHeaders.filter(h => isNumericColumn(s.rows, h));
    return {
      name: s.name,
      headers: cleanHeaders,
      numericCols,
      rowCount: s.rows.length,
      colCount: cleanHeaders.length,
    };
  });
  const id = genId();
  const ds = { id, name, uploadedAt: new Date().toISOString(), sheets };
  state.datasets = [ds, ...state.datasets];
  saveDatasets(state.datasets);
  const rowsBySheet = {};
  sheetsData.forEach(s => { rowsBySheet[s.name] = s.rows; });
  saveDatasetRows(id, rowsBySheet);
  state.uploadError = null;
  selectDataset(id);
}

function handleFileUpload(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  state.uploadError = null;

  if (ext === 'csv') {
    // CSV files only ever contain a single flat table (no sheet concept)
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = Papa.parse(e.target.result, { header: true, dynamicTyping: true, skipEmptyLines: true });
        const headers = parsed.meta && parsed.meta.fields ? parsed.meta.fields : [];
        if (!headers.length || !parsed.data.length) throw new Error('empty');
        addDataset(file.name, [{ name: '데이터', headers, rows: parsed.data }]);
      } catch (err) {
        state.uploadError = 'CSV 파일을 읽는 중 오류가 발생했습니다. 파일 형식을 확인해주세요.';
        render();
      }
    };
    reader.onerror = () => { state.uploadError = 'CSV 파일을 읽는 중 오류가 발생했습니다.'; render(); };
    reader.readAsText(file, 'utf-8');
  } else if (ext === 'xlsx' || ext === 'xls') {
    // Excel files can contain multiple sheets — read all of them
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetsData = workbook.SheetNames.map(sheetName => {
          const sheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: null });
          const headerRow = XLSX.utils.sheet_to_json(sheet, { header: 1 })[0] || [];
          const headers = rows.length ? Object.keys(rows[0]) : headerRow;
          return { name: sheetName, headers, rows };
        }).filter(s => s.headers.length > 0);

        if (!sheetsData.length) throw new Error('empty');
        addDataset(file.name, sheetsData);
      } catch (err) {
        state.uploadError = '엑셀 파일을 읽는 중 오류가 발생했습니다. 파일 형식을 확인해주세요.';
        render();
      }
    };
    reader.onerror = () => { state.uploadError = '엑셀 파일을 읽는 중 오류가 발생했습니다.'; render(); };
    reader.readAsArrayBuffer(file);
  } else {
    state.uploadError = 'CSV 또는 엑셀(.xlsx, .xls) 파일만 업로드할 수 있습니다.';
    render();
  }
}

function computeColumnStats(rows, col) {
  const values = rows
    .map(r => { const v = r[col]; return typeof v === 'number' ? v : Number(v); })
    .filter(v => typeof v === 'number' && !isNaN(v));
  const n = values.length;
  if (n === 0) return null;
  const mean = values.reduce((a, b) => a + b, 0) / n;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const variance = n > 1 ? values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1) : 0;
  const std = Math.sqrt(variance);
  return { n, mean, min, max, std };
}

function handleAddEntry(e) {

  const f = e.target;

  const value = parseFloat(valueRaw);

  const exp = currentExperiment();
  const entry = {
    id: genId(),
    sampleId: f.elements['sampleId'].value.trim() || ('S-' + String(state.entries.length + 1).padStart(3, '0')),
    value,
    unit: f.elements['unit'].value.trim() || (exp ? exp.unit : ''),

function handleSaveEdit(e, id) {

    ...x,
    sampleId: f.elements['sampleId'].value.trim() || x.sampleId,

    unit: f.elements['unit'].value.trim(),
    notes: f.elements['notes'].value.trim(),
  } : x);
  saveEntries(state.selectedId, state.entries);
  state.editingId = null;
  render();
}

function computeStats(entries) {
  const values = entries.map(e => e.value).filter(v => typeof v === 'number' && !isNaN(v));
  const n = values.length;
  if (n === 0) return null;
  const mean = values.reduce((a, b) => a + b, 0) / n;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const variance = n > 1 ? values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1) : 0;
  const std = Math.sqrt(variance);
  return { n, mean, min, max, std };
}

    const values = state.entries.map(e => e.value);
    chartInstance = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values,
          borderColor: '#000000',
          backgroundColor: 'rgba(0,0,0,0.08)',
          pointBackgroundColor: '#6B5900',
          pointBorderWidth: 0,
          pointRadius: 3,
          borderWidth: 2,
          tension: 0.35,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false }, tooltip: { titleFont: { family: 'IBM Plex Mono' }, bodyFont: { family: 'IBM Plex Mono' } } },
        scales: {
          x: { grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 10 } } },
          y: { grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 10 } } },
        }
      }
    });
  }

  // ---- draw dataset comparison chart ----
  const dsCanvas = document.getElementById('lb-dataset-chart');
  if (dsCanvas && window.Chart) {
    if (datasetChartInstance) { datasetChartInstance.destroy(); datasetChartInstance = null; }
    const rows = state.datasetRows;
    const labels = rows.map(r => {
      const v = r[state.xColumn];
      return v === null || v === undefined ? '' : String(v);
    });
    const datasets = state.yColumns.map((col, i) => {
      const palette = CHART_PALETTE[i % CHART_PALETTE.length];
      return {
        label: col,
        data: rows.map(r => {
          const v = r[col];
          const n = typeof v === 'number' ? v : Number(v);
          return isNaN(n) ? null : n;
        }),
        borderColor: palette.color,
        backgroundColor: 'transparent',
        borderDash: palette.dash,
        pointRadius: 2,
        pointBackgroundColor: palette.color,
        borderWidth: 2,
        tension: 0.3,
        spanGaps: true,
      };
    });
    datasetChartInstance = new Chart(dsCanvas.getContext('2d'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        plugins: {
          legend: { display: datasets.length > 1, labels: { color: '#000000', font: { family: 'IBM Plex Mono', size: 10 } } },
          tooltip: { titleFont: { family: 'IBM Plex Mono' }, bodyFont: { family: 'IBM Plex Mono' } }
        },
        scales: {
          x: { grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 10 }, maxRotation: 0, autoSkip: true } },
          y: { grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 10 } } },
        }
      }
    });
  }

  // ---- draw sheet-to-sheet overlay comparison chart ----
  const sheetCmpCanvas = document.getElementById('lb-sheet-compare-chart');
  if (sheetCompareChartInstance) { sheetCompareChartInstance.destroy(); sheetCompareChartInstance = null; }
  if (sheetCmpCanvas && window.Chart) {
    const cds = currentDataset();
    if (cds) {
      const cmpDatasets = [];
      let colorIdx = 0;
      state.sheetCompareSelected.forEach(sheetName => {
        const sheetRows = state.datasetRowsBySheet[sheetName] || [];
        state.sheetCompareYColumns.forEach(col => {
          const palette = CHART_PALETTE[colorIdx % CHART_PALETTE.length];
          colorIdx++;
          const points = sheetRows.map(r => {
            const xv = r[state.sheetCompareXColumn];
            const yvRaw = r[col];
            const yv = typeof yvRaw === 'number' ? yvRaw : Number(yvRaw);
            return { x: xv, y: yv };
          }).filter(p => p.x !== null && p.x !== undefined && p.x !== '' && !isNaN(p.y));
          cmpDatasets.push({
            label: state.sheetCompareYColumns.length > 1 ? `${sheetName} · ${col}` : sheetName,
            data: points,
            borderColor: palette.color,
            backgroundColor: 'transparent',
            borderDash: palette.dash,
            pointRadius: 2,
            pointBackgroundColor: palette.color,
            borderWidth: 2,
            tension: 0.3,
            spanGaps: true,
          });
        });
      });
      sheetCompareChartInstance = new Chart(sheetCmpCanvas.getContext('2d'), {
        type: 'line',
        data: { datasets: cmpDatasets },
        options: {
          responsive: true,
          plugins: {
            legend: { display: true, labels: { color: '#000000', font: { family: 'IBM Plex Mono', size: 10 } } },
            tooltip: { titleFont: { family: 'IBM Plex Mono' }, bodyFont: { family: 'IBM Plex Mono' } }
          },
          scales: {
            x: { type: 'category', grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 10 }, maxRotation: 0, autoSkip: true } },
            y: { grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 10 } } },
          }
        }
      });
    }
  }

  // ---- draw compare-mode panel charts (1행 비교) ----
  Object.keys(compareChartInstances).forEach(key => {
    if (compareChartInstances[key]) compareChartInstances[key].destroy();
  });
  compareChartInstances = {};
  if (state.datasetView === 'compare' && window.Chart) {
    state.compareSelectedIds.forEach(id => {
      const canvas = document.getElementById('lb-compare-chart-' + id);
      const cfg = state.compareConfig[id];
      if (!canvas || !cfg) return;
      const rowsBySheet = state.compareRowsBySheet[id] || {};
      const rows = rowsBySheet[cfg.activeSheetName] || [];
      const labels = rows.map(r => {
        const v = r[cfg.xColumn];
        return v === null || v === undefined ? '' : String(v);
      });
      const datasets = cfg.yColumns.map((col, i) => {
        const palette = CHART_PALETTE[i % CHART_PALETTE.length];
        return {
          label: col,
          data: rows.map(r => {
            const v = r[col];
            const n = typeof v === 'number' ? v : Number(v);
            return isNaN(n) ? null : n;
          }),
          borderColor: palette.color,
          backgroundColor: 'transparent',
          borderDash: palette.dash,
          pointRadius: 2,
          pointBackgroundColor: palette.color,
          borderWidth: 2,
          tension: 0.3,
          spanGaps: true,
        };
      });
      compareChartInstances[id] = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { display: datasets.length > 1, labels: { color: '#000000', font: { family: 'IBM Plex Mono', size: 9 } } },
            tooltip: { titleFont: { family: 'IBM Plex Mono' }, bodyFont: { family: 'IBM Plex Mono' } }
          },
          scales: {
            x: { grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 9 }, maxRotation: 0, autoSkip: true } },
            y: { grid: { color: 'rgba(0,0,0,0.12)' }, ticks: { color: '#000000', font: { size: 9 } } },
          }
        }
      });
    });
  }
}

function renderDatasetListScreen() {
  let html = '';

  if (state.datasets.length >= 1 && !state.compareMode && !state.deleteMode) {
    html += `<div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px;">
      ${state.datasets.length >= 2 ? `<button class="lb-btn lb-btn-ghost" style="padding:7px 12px; font-size:12.5px;" onclick="toggleCompareMode()">⇄ 비교하기</button>` : ''}
      <button class="lb-btn lb-btn-ghost" style="padding:7px 12px; font-size:12.5px;" onclick="toggleDeleteMode()">🗑 삭제</button>
    </div>`;
  } else if (state.compareMode) {
    html += `<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
      <span style="font-size:12.5px; color:var(--ink-soft);">비교할 데이터를 2개 이상 선택하세요 (${state.compareSelectedIds.length}개 선택됨)</span>
      <div style="display:flex; gap:8px;">
        <button class="lb-btn lb-btn-primary" style="padding:7px 14px; font-size:12.5px;" ${state.compareSelectedIds.length < 2 ? 'disabled' : ''} onclick="startCompare()">비교 화면 보기</button>
        <button class="lb-btn lb-btn-ghost" style="padding:7px 14px; font-size:12.5px;" onclick="toggleCompareMode()">취소</button>
      </div>
    </div>`;
  } else if (state.deleteMode) {
    html += `<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
      <span style="font-size:12.5px; color:var(--ink-soft);">삭제할 데이터를 선택하세요 (${state.deleteSelectedIds.length}개 선택됨)</span>
      <div style="display:flex; gap:8px;">
        <button class="lb-btn lb-btn-danger" style="padding:7px 14px; font-size:12.5px;" ${state.deleteSelectedIds.length < 1 ? 'disabled' : ''} onclick="deleteSelectedDatasets()">선택 삭제</button>
        <button class="lb-btn lb-btn-ghost" style="padding:7px 14px; font-size:12.5px;" onclick="toggleDeleteMode()">취소</button>
      </div>
    </div>`;
  }

  html += '<div class="lb-exp-grid">';
  state.datasets.forEach(d => {
    const sheets = getDatasetSheets(d);
    const totalRows = sheets.reduce((sum, s) => sum + s.rowCount, 0);
    const meta = sheets.length > 1
      ? `${sheets.length}개 시트 · ${totalRows}행`
      : `${sheets[0] ? sheets[0].rowCount : 0}행 × ${sheets[0] ? sheets[0].colCount : 0}열`;

    let selected = false;
    let onClickAttr = `selectDataset('${d.id}')`;
    let cardClass = 'lb-exp-card';
    if (state.compareMode) {
      selected = state.compareSelectedIds.includes(d.id);
      onClickAttr = `toggleCompareSelect('${d.id}')`;
      if (selected) cardClass += ' selected';
    } else if (state.deleteMode) {
      selected = state.deleteSelectedIds.includes(d.id);
      onClickAttr = `toggleDeleteSelect('${d.id}')`;
      if (selected) cardClass += ' delete-selected';
    }

    html += `
      <button class="${cardClass}" onclick="${onClickAttr}" title="${esc(d.name)}">
        ${(state.compareMode || state.deleteMode) ? `<span class="lb-exp-card-check">${selected ? '✓' : ''}</span>` : ''}
        <div class="lb-exp-card-name">${esc(d.name)}</div>
        <div class="lb-exp-card-meta">${meta}</div>
        <div class="lb-exp-card-count">${esc(formatTime(d.uploadedAt))}</div>
      </button>`;
  });
  if (!state.compareMode && !state.deleteMode) {
    html += `<button class="lb-exp-card lb-exp-card-add" onclick="document.getElementById('lb-file-input').click()">+ 업로드</button>`;
  }
  html += `</div>`;
  html += `<p class="lb-hint">CSV 또는 엑셀(.xlsx, .xls) 파일을 업로드하면 자동으로 그래프와 통계를 만들어드려요. 엑셀에 여러 시트가 있으면 시트별로 전환해서 볼 수 있고, 데이터가 2개 이상이면 나란히 비교할 수 있어요.</p>`;

  if (state.datasets.length === 0) {
    html += `<div class="lb-card lb-empty">아직 업로드된 데이터가 없습니다. <b>+ 업로드</b>를 눌러 CSV 또는 엑셀 파일을 추가하세요.</div>`;
  }
  return html;
}

function renderDatasetCompareScreen() {
  let html = '<div class="lb-compare-row">';

    const ds = state.datasets.find(d => d.id === id);
    if (!ds) return;
    const cfg = state.compareConfig[id];
    if (!cfg) return;
    const sheets = getDatasetSheets(ds);
    const sheetMeta = sheets.find(s => s.name === cfg.activeSheetName) || sheets[0];
    const rowsBySheet = state.compareRowsBySheet[id] || {};
    const rows = rowsBySheet[cfg.activeSheetName] || [];

    html += `<div class="lb-compare-panel">`;
    html += `<div class="lb-compare-panel-name" title="${esc(ds.name)}">${esc(ds.name)}</div>`;

    if (sheets.length > 1) {
      html += `<div class="lb-sheet-tabs">
        ${sheets.map(s => `<button class="lb-chip${s.name === cfg.activeSheetName ? ' active' : ''}" style="font-size:10.5px; padding:5px 9px;" onclick="setComparePanelSheet('${id}','${esc(s.name)}')">${esc(s.name)}</button>`).join('')}
      </div>`;
    }

    html += `<div class="lb-select-row">
      <label>X축</label>
      <select class="lb-select" style="font-size:12px; padding:5px 7px;" onchange="setComparePanelX('${id}', this.value)">
        ${sheetMeta.headers.map(h => `<option value="${esc(h)}"${h === cfg.xColumn ? ' selected' : ''}>${esc(h)}</option>`).join('')}
      </select>
    </div>`;

    html += `<div class="lb-ycol-list">
      ${sheetMeta.numericCols.length
        ? sheetMeta.numericCols.map(c => `
          <label class="lb-ycol-chip${cfg.yColumns.includes(c) ? ' active' : ''}" style="font-size:10.5px; padding:5px 9px;">
            <input type="checkbox"${cfg.yColumns.includes(c) ? ' checked' : ''} onchange="toggleComparePanelY('${id}','${esc(c)}')" />${esc(c)}

    html += cfg.yColumns.length
      ? `<canvas id="lb-compare-chart-${id}" height="140"></canvas>`
      : `<div class="lb-empty" style="padding:16px 6px; font-size:12px;">항목을 선택하세요.</div>`;

    if (cfg.yColumns.length) {
      html += `<table class="lb-compare-table" style="margin-top:10px;">
        <thead><tr><th>항목</th><th>n</th><th>평균</th><th>최소</th><th>최대</th></tr></thead>
        <tbody>
          ${cfg.yColumns.map(col => {
            const s = computeColumnStats(rows, col);
            return `<tr>
              <td>${esc(col)}</td>
              <td>${s ? s.n : '—'}</td>
              <td>${s ? round(s.mean, 3) : '—'}</td>
              <td>${s ? round(s.min, 3) : '—'}</td>
              <td>${s ? round(s.max, 3) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    }

    html += `</div>`;
  });
  html += '</div>';
  return html;
}

function renderDatasetDetailScreen(ds) {
  const rows = state.datasetRows;
  const sheets = getDatasetSheets(ds);
  const sheetMeta = sheets.find(s => s.name === state.activeSheetName) || sheets[0];
  const totalRows = sheets.reduce((sum, s) => sum + s.rowCount, 0);
  const metaLine = sheets.length > 1
    ? `${sheets.length}개 시트 · 총 ${totalRows}행 · 업로드 ${esc(formatTime(ds.uploadedAt))}`
    : `${sheetMeta.rowCount}행 × ${sheetMeta.colCount}열 · 업로드 ${esc(formatTime(ds.uploadedAt))}`;

  let html = `
    <div class="lb-card">
      ${state.editingDatasetName
        ? `<form onsubmit="saveDatasetNameEdit(event, '${ds.id}')" style="display:flex; gap:6px; align-items:center; margin-bottom:4px;">
             <input class="lb-inline-name-input" name="name" value="${esc(ds.name)}" autofocus style="flex:1; font-size:18px;" />
             <button type="submit" class="lb-btn lb-btn-primary" style="padding:6px 12px; font-size:12px;">저장</button>
             <button type="button" class="lb-btn lb-btn-ghost" style="padding:6px 12px; font-size:12px;" onclick="cancelEditDatasetName()">취소</button>
           </form>`
        : `<div style="display:flex; align-items:center; gap:4px;">
             <h2 class="lb-exp-name" style="margin:0;">${esc(ds.name)}</h2>
             <button class="lb-btn-icon" onclick="startEditDatasetName()" title="이름 수정">✎</button>
           </div>`
      }
      <div class="lb-exp-meta">${metaLine}</div>
      ${!state.confirmDeleteDataset
        ? `<button class="lb-btn-icon" onclick="askDeleteDataset()" title="데이터 삭제">🗑</button>`
        : `<div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
             <span style="font-size:12.5px; color:var(--alert);">이 데이터를 삭제할까요?</span>
             <button class="lb-btn lb-btn-danger" onclick="deleteDatasetConfirmed('${ds.id}')">삭제</button>
             <button class="lb-btn lb-btn-ghost" onclick="cancelDeleteDataset()">취소</button>
           </div>`
      }
    </div>
  `;

  if (sheets.length > 1) {
    html += `
      <div class="lb-sheet-tabs">
        ${sheets.map(s => `<button class="lb-chip${s.name === state.activeSheetName ? ' active' : ''}" onclick="selectSheet('${esc(s.name)}')">${esc(s.name)} <span style="opacity:.6;">(${s.rowCount})</span></button>`).join('')}
      </div>`;

    const commonHeaders = computeCommonHeaders(ds, state.sheetCompareSelected);
    const commonNumeric = computeCommonNumericCols(ds, state.sheetCompareSelected);
    html += `
      <div class="lb-card">
        <p class="lb-section-label">시트 간 비교 그래프</p>
        <span class="lb-ycol-label">비교할 시트 선택 (추가/제거하면 그래프가 바로 갱신돼요)</span>
        <div class="lb-ycol-list">
          ${sheets.map(s => `
            <label class="lb-ycol-chip${state.sheetCompareSelected.includes(s.name) ? ' active' : ''}">
              <input type="checkbox"${state.sheetCompareSelected.includes(s.name) ? ' checked' : ''} onchange="toggleSheetCompareSelect('${esc(s.name)}')" />${esc(s.name)}
            </label>`).join('')}
        </div>
        ${state.sheetCompareSelected.length < 2
          ? '<div class="lb-empty">비교할 시트를 2개 이상 선택하세요.</div>'
          : (!commonHeaders.length
              ? '<div class="lb-empty">선택한 시트들에 공통된 열이 없습니다.</div>'
              : `
                <div class="lb-select-row">
                  <label>X축 (공통 열)</label>
                  <select class="lb-select" onchange="setSheetCompareX(this.value)">
                    ${commonHeaders.map(h => `<option value="${esc(h)}"${h === state.sheetCompareXColumn ? ' selected' : ''}>${esc(h)}</option>`).join('')}
                  </select>
                </div>
                <span class="lb-ycol-label">비교할 항목 (Y축, 공통 숫자 열만 표시)</span>
                <div class="lb-ycol-list">
                  ${commonNumeric.length
                    ? commonNumeric.map(c => `
                      <label class="lb-ycol-chip${state.sheetCompareYColumns.includes(c) ? ' active' : ''}">
                        <input type="checkbox"${state.sheetCompareYColumns.includes(c) ? ' checked' : ''} onchange="toggleSheetCompareY('${esc(c)}')" />${esc(c)}
                      </label>`).join('')
                    : '<span style="font-size:12px;color:var(--ink-faint);">선택한 시트들에 공통된 숫자 열이 없습니다.</span>'
                  }
                </div>
                ${state.sheetCompareYColumns.length
                  ? '<canvas id="lb-sheet-compare-chart" height="150"></canvas>'
                  : '<div class="lb-empty">비교할 항목을 하나 이상 선택하세요.</div>'
                }
              `)
        }
      </div>`;
  }

  html += `
    <div class="lb-card">
      <p class="lb-section-label">그래프 설정</p>
      <div class="lb-select-row">
        <label>X축</label>
        <select class="lb-select" onchange="setXColumn(this.value)">
          ${sheetMeta.headers.map(h => `<option value="${esc(h)}"${h === state.xColumn ? ' selected' : ''}>${esc(h)}</option>`).join('')}
        </select>
      </div>
      <span class="lb-ycol-label">비교할 항목 (Y축, 다중 선택 가능)</span>
      <div class="lb-ycol-list">
        ${sheetMeta.numericCols.length
          ? sheetMeta.numericCols.map(c => `
            <label class="lb-ycol-chip${state.yColumns.includes(c) ? ' active' : ''}">
              <input type="checkbox"${state.yColumns.includes(c) ? ' checked' : ''} onchange="toggleYColumn('${esc(c)}')" />${esc(c)}
            </label>`).join('')
          : '<span style="font-size:12px;color:var(--ink-faint);">숫자로 된 열을 찾지 못했습니다.</span>'
        }
      </div>
      ${state.yColumns.length
        ? '<canvas id="lb-dataset-chart" height="140"></canvas>'
        : '<div class="lb-empty">비교할 항목을 하나 이상 선택하세요.</div>'
      }
    </div>
  `;

  if (state.yColumns.length) {
    html += `
      <div class="lb-card">
        <p class="lb-section-label">결과값 비교</p>
        <table class="lb-compare-table">
          <thead><tr><th>항목</th><th>n</th><th>평균</th><th>최소</th><th>최대</th><th>표준편차</th></tr></thead>
          <tbody>
            ${state.yColumns.map(col => {
              const s = computeColumnStats(rows, col);
              return `<tr>
                <td>${esc(col)}</td>
                <td>${s ? s.n : '—'}</td>
                <td>${s ? round(s.mean, 3) : '—'}</td>
                <td>${s ? round(s.min, 3) : '—'}</td>
                <td>${s ? round(s.max, 3) : '—'}</td>
                <td>${s && s.n > 1 ? round(s.std, 3) : '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  const previewRows = rows.slice(0, 8);
  html += `
    <div class="lb-card">
      <p class="lb-section-label">데이터 미리보기</p>
      <div class="lb-preview-wrap">
        <table class="lb-preview-table">
          <thead><tr>${sheetMeta.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>
            ${previewRows.map(r => `<tr>${sheetMeta.headers.map(h => {
              const v = r[h];
              return `<td>${esc(v === null || v === undefined ? '' : v)}</td>`;
            }).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${rows.length > previewRows.length ? `<p class="lb-preview-note">총 ${rows.length}행 중 상위 ${previewRows.length}행 표시</p>` : ''}
    </div>`;

  return html;
}

init();
</script>


</body></html>
